<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RPM Motors">
  <title>RPM Motors</title>
  <!-- Selo -->
  <circle cx="32" cy="32" r="31" fill="#1b1b1f"/>
  <circle cx="32" cy="32" r="30.5" fill="none" stroke="#d62828" stroke-width="2"/>
  <!-- Mostrador do tacômetro -->
  <path d="M 12.95 43 A 22 22 0 1 1 51.05 43" fill="none" stroke="#ffffff"
        stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Zona vermelha -->
  <path d="M 51.05 21 A 22 22 0 0 1 51.05 43" fill="none" stroke="#d62828"
        stroke-width="3.5" stroke-linecap="round"/>
  <!-- Marcações -->
  <g stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="16.4" y1="36.5" x2="12.9" y2="38.5"/>
    <line x1="18.5" y1="24.6" x2="15.0" y2="22.6"/>
    <line x1="27.0" y1="17.4" x2="26.0" y2="13.5"/>
    <line x1="37.0" y1="17.4" x2="38.0" y2="13.5"/>
    <line x1="45.5" y1="24.6" x2="49.0" y2="22.6"/>
  </g>
  <!-- Ponteiro na zona vermelha -->
  <line x1="32" y1="32" x2="48" y2="27" stroke="#d62828" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="4.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2" fill="#d62828"/>
</svg>
